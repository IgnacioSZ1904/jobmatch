[project]
name = "jobmatch"
version = "0.1.0"
description = "Recoge ofertas de empleo de software, las normaliza y las puntúa según tu perfil."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "sqlmodel>=0.0.16",
    "pyyaml>=6.0",
    "rapidfuzz>=3.6",
    "python-dotenv>=1.0",
    "streamlit>=1.35",
    "pandas>=2.2",
    "plotly>=5.20",
    "pypdf>=4.0",
]

[project.optional-dependencies]
semantic = ["sentence-transformers>=3.0"]
dev = ["pytest>=8.0", "ruff>=0.5", "reportlab>=4.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobmatch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["slow: usa el modelo de embeddings real"]
addopts = "-m 'not slow'"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
